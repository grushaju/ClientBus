function tag(value){return `<span class="tag ${value==='reauth'?'warn':['concept','disabled'].includes(value)?'neutral':''}">${{connected:'Подключено',reauth:'Требуется вход',disabled:'Отключено',concept:'Концепт'}[value]||escape(value)}</span>`;}
function toast(message){clearTimeout(toastTimer);$('#toast').innerHTML=icon('check')+`<span>${escape(message)}</span>`;toastTimer=setTimeout(()=>{$('#toast').textContent='';},5000);}
function focusKey(el=document.activeElement){return el?.dataset?.focus||el?.id||null;}
function focusElement(key){if(!key)return null;const selector=`[data-focus="${CSS.escape(key)}"]`,dialog=document.querySelector('dialog[open]');return dialog?.querySelector(selector)||document.querySelector(selector)||document.getElementById(key);}
function restoreFocus(key,fallback){const el=focusElement(key)||focusElement(fallback);if(el&&!el.disabled)el.focus({preventScroll:true});}
function cancelPending(){++owner;state.busy=null;}
function closeModal(){if($('#modal').open)$('#modal').close();modalState=null;restoreFocus(modalOpener);}
function closeDrawer(){state.drawer=null;if($('#drawer').open)$('#drawer').close();restoreFocus(drawerOpener,state.mapping?'unlinked-only':'master-search');}
function resetFilters(){state.query='';state.serviceQuery='';state.serviceMaster='';state.unlinkedOnly=false;}
function navigate(screen,workspaceId,projectId,tab){

 if(workspaceId&&allowedWorkspace(workspaceId))state.scope=workspaceId;
 if(projectId){const p=project(projectId);if(p&&allowedWorkspace(p.workspace)){state.scope=p.workspace;state.selectedProjects[p.workspace]=p.id;if(p.concept)state.future=true;}}

function updateUrl(){try{history.replaceState(null,'',location.pathname+'?screen='+state.screen+'&role='+state.role);}catch{}}
function crumb(parts){return `<div class="breadcrumb"><span>Студия «Пример»</span>${parts.map(part=>icon('chevron')+'<span>'+escape(part)+'</span>').join('')}</div>`;}
function heading(title,description,actions=''){return `<div class="page-heading"><div><h1>${title}</h1><p>${description}</p></div>${actions?'<div class="button-row">'+actions+'</div>':''}</div>`;}
function currentProject(){if(state.screen!=='crm')return null;const list=visibleProjects(),selected=list.find(p=>p.id===state.selectedProjects[state.scope])||list[0];if(selected)state.selectedProjects[state.scope]=selected.id;return selected||null;}
function currentMaster(){const p=currentProject();return p&&state.drawer?.project===p.id?p.masters.find(m=>m.id===state.drawer.master):null;}
function canRefresh(p){return !p.concept&&p.enabled&&connection(p.connection).status==='connected'&&!state.busy;}
function projectNotice(p){
 if(p.concept)return `<div class="info-note">${icon('info')}Пример будущей CRM. Каталог услуг для этого адаптера пока не заявлен.</div>`;
 const c=connection(p.connection);if(c.status==='connected'&&p.enabled)return '';
 let title,action,id;

 else if(c.status==='disabled'){title='Аккаунт CRM отключён';action='recovery-account';id=c.id;}
 else{title='Обновление проекта отключено';action='toggle-project';id=p.id;}

 return `<div class="notice" role="status">${icon('warning')}<div><strong>${title}</strong><p>Показаны ранее загруженные данные: ${escape(p.lastSync)}. ${admin()?'': 'Доступ восстанавливает администратор.'}</p>${admin()?button(label,action,'',`data-id="${id}" data-project="${p.id}"`):''}</div></div>`;
}
function masterOpen(m){return `<button type="button" class="master-name-button" data-action="master-details" data-id="${escape(m.id)}" data-focus="master-open-${escape(m.id)}" aria-label="Подробности мастера ${escape(m.name)}"><span class="avatar ${m.color}">${escape(m.initials)}</span><strong>${escape(m.name)}</strong></button>`;}

function bindingControl(p,m,detail=false){

function filteredMasters(p){const q=state.query.toLocaleLowerCase('ru').trim(),mapping=mappingActive(p);return p.masters.filter(m=>(!mapping||!state.unlinkedOnly||!m.employee)&&(!q||(m.name+' '+(mapping?employeeName(m.employee):(p.services||[]).filter(s=>s.master===m.id).map(s=>s.name).join(' '))).toLocaleLowerCase('ru').includes(q)));}

}
function feedbackMarkup(p){const f=state.feedback;if(!mappingActive(p)||!f||f.project!==p.id)return '';return `<div class="inline-feedback ${f.error?'error':''}" role="${f.error?'alert':'status'}"><span>${escape(f.message)}</span>${f.undo?button('Отменить','undo-link','',`data-focus="undo-link"`):f.retry?button('Повторить','retry-link','',`data-focus="retry-link"`):''}</div>`;}
function masterTable(p){
 const mapping=mappingActive(p),count=p.masters.filter(m=>m.employee).length;

}
function filteredServices(p){const q=state.serviceQuery.toLocaleLowerCase('ru').trim();return (p.services||[]).filter(s=>(!state.serviceMaster||s.master===state.serviceMaster)&&(!q||(s.name+' '+(p.masters.find(m=>m.id===s.master)?.name||'')).toLocaleLowerCase('ru').includes(q)));}
function serviceRows(p){const list=filteredServices(p);return list.length?list.map((s,index)=>{const m=p.masters.find(m=>m.id===s.master);return `<div class="service-row" role="row"><strong role="cell">${escape(s.name)}</strong><span role="cell">${m?button(escape(m.name),'master-details','text-button',`data-id="${escape(m.id)}" data-focus="service-open-${escape(m.id)}-${index}" aria-label="Подробности мастера ${escape(m.name)}"`):'Мастер не указан'}</span><span role="cell">${escape(s.price)}</span><span role="cell">${escape(s.duration)}</span></div>`;}).join(''):emptyRows((p.services||[]).length?'Услуги по вашему запросу не найдены.':'В этом проекте пока нет услуг.',(p.services||[]).length?'clear-filters':null);}
function servicesTable(p){return `<div class="master-toolbar"><label class="master-search">${icon('search')}<input id="service-search" type="search" aria-label="Поиск услуг" value="${escape(state.serviceQuery)}" placeholder="Услуга или имя мастера…"></label><label class="service-master-label">Мастер<select id="service-master" aria-label="Мастер услуги"><option value="">Все мастера</option>${p.masters.map(m=>`<option value="${escape(m.id)}" ${state.serviceMaster===m.id?'selected':''}>${escape(m.name)}</option>`).join('')}</select></label></div><section class="panel service-catalog" aria-label="Услуги проекта"><div role="table" aria-label="Услуги и предложения мастеров"><div class="service-labels" role="row"><span role="columnheader">Услуга</span><span role="columnheader">Мастер</span><span role="columnheader">Цена</span><span role="columnheader">Длительность</span></div><div id="service-table-rows" role="rowgroup">${serviceRows(p)}</div></div><div class="panel-footer"><span id="service-table-count">Показано ${filteredServices(p).length} из ${(p.services||[]).length}</span><span>Цена и длительность у выбранного мастера</span></div></section>`;}
function crmScreen(){
 const projects=visibleProjects(),p=currentProject(),w=workspace(state.scope);let html=`<div class="crm-heading"><h1>CRM</h1><span>${escape(w.name)}</span></div>`;
 if(!p)return html+`<div class="panel empty-state"><div class="empty-symbol">${icon('link')}</div><h2>CRM ещё не настроена</h2><p>${admin()?'Привяжите проект, чтобы загрузить услуги и мастеров.':'Администратор подключит CRM к этому рабочему пространству.'}</p>${admin()?button('Настроить CRM','workspace-settings','primary',`data-workspace="${w.id}"`):''}</div>`;
 const c=connection(p.connection);
 html+=`<div class="project-context"><div class="project-context-main">${mark(p.provider,true)}<div>${projects.length>1?`<label class="project-select-label">Проект CRM<select id="crm-project" aria-label="Проект CRM">${projects.map(item=>`<option value="${item.id}" ${p.id===item.id?'selected':''}>${providers[item.provider].name} · ${escape(item.name)}</option>`).join('')}</select></label>`:`<h2>${providers[p.provider].name} · ${escape(p.name)}</h2>`}</div></div><details class="project-details"><summary>О проекте</summary><div><p>ID ${escape(p.externalId)}</p><p>${escape(zoneLabel(p.zone))}</p>${admin()?button('Настройки проекта','workspace-settings','quiet',`data-workspace="${w.id}" data-project="${p.id}"`):''}</div></details></div>`;
 html+=`<div class="project-health"><div>${p.enabled?tag(c.status):'<span class="tag neutral">Обновление проекта отключено</span>'}<span class="data-state ${p.stale?'stale':''}">${p.concept?'Демонстрационные данные':state.busy===p.id?'Обновление…':'Данные: '+escape(p.lastSync)}</span>${p.stale?'<span class="tag warn no-dot">Данные могут быть устаревшими</span>':''}</div>${!p.concept?button(icon('refresh')+(state.busy===p.id?'Обновление…':'Обновить'),'refresh',state.busy===p.id?'spin':'quiet',`data-id="${p.id}" data-focus="refresh" aria-label="Обновить данные" ${canRefresh(p)?'':'disabled'}`):''}</div>`;
 html+=projectNotice(p)+`<div class="tabs crm-tabs" role="tablist" aria-label="Данные CRM">${(p.provider==='DIKIDI'?['services','masters']:['masters']).map(tab=>`<button type="button" id="tab-${tab}" class="tab" role="tab" aria-controls="crm-panel" aria-selected="${state.crmTab===tab}" tabindex="${state.crmTab===tab?'0':'-1'}" data-action="crm-tab" data-tab="${tab}">${tab==='services'?'Услуги':'Мастера'}</button>`).join('')}</div><div id="crm-panel" role="tabpanel" aria-labelledby="tab-${state.crmTab}">${state.crmTab==='services'?servicesTable(p):masterTable(p)}</div>`;

function render(key){
 const active=key||focusKey();if(!workspace(state.scope)||!allowedWorkspace(state.scope))state.scope='forest';
 const p=currentProject();if(p?.provider!=='DIKIDI'&&state.screen==='crm')state.crmTab='masters';if(!canManage(p)||state.crmTab!=='masters')state.mapping=false;
 document.querySelectorAll('[data-role]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.role===state.role)));
 document.querySelectorAll('[data-route]').forEach(el=>{const current=el.dataset.route===state.screen;el.classList.toggle('active',current);el.setAttribute('aria-pressed',String(current));if(el.classList.contains('nav-link')){if(current)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current');}});
 $('#show-future').checked=state.future;$('#large-data').checked=state.large;$('#simulate-save-error').checked=state.failSave;
 const demoLabel=$('#demo-role-label');if(demoLabel)demoLabel.textContent=roleLabel();
 $('#workspace').innerHTML=state.workspaces.filter(w=>allowedWorkspace(w.id)).map(w=>`<option value="${w.id}">${escape(w.name)}</option>`).join('');$('#workspace').value=state.scope;
 $('#user').innerHTML=`<span class="avatar ${admin()?'':'sage'}">${admin()?'АК':'МС'}</span><span><strong>${admin()?'Александр К.':'Мария Соколова'}</strong><small>${roleLabel()}</small></span>`;
 $('#content').innerHTML=state.screen==='settings'?settingsScreen():state.screen==='workspace'?workspaceScreen():crmScreen();document.querySelectorAll('#content [data-action]').forEach((el,index)=>{if(!el.dataset.focus)el.dataset.focus='action-'+el.dataset.action+'-'+(el.dataset.id||'')+'-'+index;});renderDrawer();updateUrl();restoreFocus(active,state.mapping?'unlinked-only':null);
}
function openMaster(id){const p=currentProject(),m=p?.masters.find(item=>item.id===id);if(!m)return;drawerOpener=focusKey()||'master-open-'+id;state.drawer={project:p.id,master:id};renderDrawer();$('#drawer').showModal();}
function renderDrawer(){
 if(!state.drawer)return;const p=currentProject(),m=currentMaster();if(!p||!m){closeDrawer();return;}
 const mapping=mappingActive(p),offers=(p.services||[]).filter(s=>s.master===m.id);
 $('#drawer-content').innerHTML=`<div class="drawer-shell"><div class="drawer-head"><div class="drawer-head-top"><span class="eyebrow">Карточка мастера</span>${button(icon('close'),'close-drawer','quiet icon-only','aria-label="Закрыть панель" data-focus="drawer-close"')}</div><div class="master-detail-identity"><span class="avatar ${m.color}">${escape(m.initials)}</span><div><h2 id="drawer-title">${escape(m.name)}</h2><p>${providers[p.provider].name} · ${escape(p.name)}</p></div></div></div><div class="drawer-body">${mapping?feedbackMarkup(p):''}${mapping?`<section class="panel"><div class="panel-body"><h3>Связь с сотрудником</h3>${bindingControl(p,m,true)}<p class="help-line">Укажите того же человека в ClientBus.</p></div></section>`:''}<section class="panel"><div class="masters-head"><h3>${p.provider==='DIKIDI'?'Услуги мастера':'Сведения'}</h3></div>${offers.map(s=>`<div class="master-offer"><strong>${escape(s.name)}</strong><span>${escape(s.price)} · ${escape(s.duration)}</span></div>`).join('')||'<div class="table-empty">Услуги пока не представлены.</div>'}</section>${p.provider==='DIKIDI'?button('Показать услуги в каталоге','master-services','',`data-id="${escape(m.id)}"`):''}<p class="help-line">Данные: ${escape(p.lastSync)}</p></div><div class="drawer-bottom"><span>${escape(workspace(p.workspace).name)}</span>${button('Закрыть','close-drawer','quiet')}</div></div>`;
}
function modalShell(title,description,body,submit='Сохранить',extra=''){return `<form id="modal-form"><div class="dialog-head"><div><h2 id="modal-title">${title}</h2><p>${description}</p></div>${button(icon('close'),'close-modal','quiet icon-only','aria-label="Закрыть форму"')}</div><div class="dialog-body">${body}<p id="dialog-error" class="dialog-error" role="alert"></p></div><div class="dialog-footer">${extra}${button('Отмена','close-modal')}<button type="submit" class="button primary">${submit}</button></div></form>`;}
function prepareModal(html){const wasOpen=$('#modal').open,active=focusKey(),activeName=document.activeElement?.name;if(!wasOpen)modalOpener=active;$('#modal-content').innerHTML=html;document.querySelectorAll('#modal-content .field').forEach((label,i)=>{const input=label.querySelector('input,select'),hint=label.querySelector('small');if(!input)return;input.setAttribute('aria-label',Array.from(label.childNodes).filter(n=>n.nodeType===Node.TEXT_NODE).map(n=>n.textContent).join('').trim());if(hint){hint.id='hint-'+i;input.setAttribute('aria-describedby',hint.id);}});if(!wasOpen)$('#modal').showModal();else{const old=focusElement(active)||(activeName?$('#modal').querySelector(`[name="${CSS.escape(activeName)}"]`):null);if(old&&$('#modal').contains(old))old.focus({preventScroll:true});else {$('#modal-title')?.setAttribute('tabindex','-1');$('#modal-title')?.focus();}}}
function openEmployeePicker(masterId){const p=currentProject(),m=p?.masters.find(m=>m.id===masterId);if(!mappingActive(p)||!m||state.saving)return;modalState={type:'employee-picker',project:p.id,master:m.id};prepareModal(`<div class="dialog-head"><div><h2 id="modal-title">Сотрудник для ${escape(m.name)}</h2><p>Выберите того же человека в ClientBus.</p></div>${button(icon('close'),'close-modal','quiet icon-only','aria-label="Закрыть форму"')}</div><div class="dialog-body"><label class="field">Поиск сотрудника<input id="employee-search" type="search" aria-label="Поиск сотрудника" placeholder="Имя или логин"></label><div id="employee-results">${employeeResults(p,'')}</div></div>`);$('#employee-search').focus();}
function employeeResults(p,q){const text=q.toLocaleLowerCase('ru').trim(),list=candidates(p).filter(x=>(x.name+' '+x.detail).toLocaleLowerCase('ru').includes(text));return list.length?list.map(person=>button(`<strong>${escape(person.name)}</strong><small>${escape(person.detail)}</small>`,'choose-employee','employee-choice',`data-id="${person.id}"`)).join(''):emptyRows('Сотрудники по запросу не найдены.',null);}
function saveLink(p,m,next,undoing=false){
 if(!mappingActive(p)||state.saving)return;const candidate=people.find(x=>x.id===next);if(next&&(!candidate||!candidate.workspaces.includes(p.workspace)))return;if(m.employee===next)return;
 const previous=m.employee,revision=m.revision||0,ticket=++saveOwner,actor=state.role,active=($('#drawer').open?'detail-':'')+'link-'+m.id,failed=state.failSave;state.failSave=false;state.feedback=null;state.saving={project:p.id,master:m.id};render(active);
 setTimeout(()=>{if(ticket!==saveOwner)return;state.saving=null;if(actor!==state.role||!canManage(p))return;
  if(failed||m.employee!==previous||(m.revision||0)!==revision){state.feedback={project:p.id,master:m.id,error:true,message:failed?'Не удалось сохранить связь для '+m.name+'. Предыдущая связь сохранена.':'Связь уже изменилась. Проверьте актуальное значение.',retry:failed?{next,revision}:null};}
  else{m.employee=next;m.revision=revision+1;state.feedback={project:p.id,master:m.id,message:undoing?'Предыдущая связь для '+m.name+' восстановлена.':next?m.name+' → '+employeeName(next)+'. Связь сохранена.':'Связь для '+m.name+' снята.',undo:undoing?null:{previous,next,revision:m.revision}};}
  if(currentProject()?.id===p.id)render(active);
 },350);
}
function changeTab(tab){state.crmTab=tab;state.roleTabs[state.role]=tab;state.mapping=false;render('tab-'+tab);}
function applyLargeData(enabled){
 state.large=enabled;
 if(enabled){for(const p of state.projects.filter(p=>p.provider==='DIKIDI')){for(let i=4;i<=30;i++)p.masters.push({id:'large-'+i,name:'Мастер '+String(i).padStart(2,'0'),initials:'М'+i,color:'sage',employee:'',revision:0,large:true});for(let i=p.services.length;i<100;i++)p.services.push({name:['Стрижка','Укладка','Окрашивание','Уход'][i%4]+' · вариант '+(i+1),master:p.masters[i%p.masters.length].id,price:(900+i*50).toLocaleString('ru-RU')+' ₽',duration:(30+i%5*15)+' мин',large:true});}

  else if(unavailable)fields=`<div class="form-note"><strong>${c.status==='disabled'?'Аккаунт выключен':'Требуется вход в аккаунт'}.</strong><p>Восстановите доступ перед проверкой проекта. После этого можно продолжить привязку.</p>${button(c.status==='disabled'?'Включить аккаунт':'Восстановить доступ','recover-for-bind','',`data-id="${escape(c.id)}"`)}</div>`;
  else fields=`<label class="field">ID проекта ${providers[c.provider].name}<input name="externalId" required maxlength="100" value="${escape(draft.externalId||'')}" placeholder="${c.provider==='DIKIDI'?'Например, 1007201':'ID проекта выбранной CRM'}" ${c.provider==='DIKIDI'?'inputmode="numeric"':''}><small>${c.provider==='DIKIDI'?'Укажите числовой ID проекта DIKIDI. Если он неизвестен, уточните его у владельца проекта или в поддержке DIKIDI; ID нельзя заменить телефоном аккаунта.':'Это пример будущего адаптера: укажите вымышленный ID.'}</small></label>${zoneField(draft.zone)}<div class="form-note">На следующем шаге сверим название внешнего проекта и рабочее пространство. Проверка в макете имитируется.</div>`;
  prepareModal(modalShell('Привязать проект CRM','Шаг 1 из 2 · '+escape(w.name),`<label class="field">Аккаунт CRM<select name="connection">${available.map(item=>accountOption(item,c.id)).join('')}</select><small>Аккаунт должен иметь доступ к нужному проекту.</small></label>${fields}`,'Проверить проект'));
  $('#modal-form button[type="submit"]').disabled=!!existing||unavailable;
}
function projectSettings(id){
  const p=project(id);if(!admin()||state.screen!=='workspace'||!p||p.workspace!==state.scope)return;
  modalState={type:'project-settings',id};
  prepareModal(modalShell('Настройки проекта',escape(p.name)+' · '+providers[p.provider].name,`<label class="field">Аккаунт CRM<select name="connection">${visibleConnections().filter(c=>c.provider===p.provider).map(c=>accountOption(c,p.connection)).join('')}</select><small>При смене аккаунта новый доступ должен вести к тому же проекту. Для смены доступа выберите подключённый аккаунт.</small></label>${zoneField(p.zone)}<div class="form-note"><strong>${escape(workspace(p.workspace).name)}</strong> · ID ${escape(p.externalId)}<p>Рабочее пространство, внешний проект и история сохраняются. Обновление проекта включается и отключается отдельно в его карточке.</p></div>`,'Сохранить настройки'));
}
function rememberAdminOrigin(projectId,bind=false){
  if(!admin())return;
  const p=project(projectId)||currentProject();
  if(bind)state.returnContext={screen:'workspace',workspace:state.scope,project:p?.id,tab:state.crmTab,bind:true,draft:modalState?.draft||{}};
  else if(state.screen!=='settings')state.returnContext={screen:state.screen,workspace:p?.workspace||state.scope,project:p?.id,tab:state.crmTab};
}
function showAccountToggle(c){
  if(!admin()||!c)return;
  const targets=state.projects.filter(p=>p.connection===c.id),enable=c.status==='disabled';modalState={type:'toggle-connection',id:c.id};
  prepareModal(modalShell(enable?'Включить аккаунт CRM?':'Отключить аккаунт CRM?',escape(accountLabel(c)),`<p>${enable?'Обновление будет разрешено для включённых проектов этого аккаунта. Сначала может потребоваться восстановить вход.':'Обновление остановится во всех проектах этого аккаунта. Данные, привязки и связи с сотрудниками сохранятся.'}</p><div class="form-note"><strong>Затронуто проектов: ${targets.length}</strong>${targets.length?'<ul>'+targets.map(p=>'<li>'+escape(p.name)+' · '+escape(workspace(p.workspace).name)+'</li>').join('')+'</ul>':'<p>Привязанных проектов пока нет.</p>'}</div>`,enable?'Включить аккаунт':'Отключить аккаунт'));
}
function handleAdminAction(action,el){
  const actions=['add-connection','edit-connection','choose-provider','bind','bind-back','bind-account','add-for-bind','recover-for-bind','project-settings','verify','toggle-connection','toggle-project','recovery-account','clear-account-filters','duplicate-project'];
  if(!actions.includes(action))return false;if(!admin())return true;
  const id=el.dataset.id;
  if(action==='clear-account-filters'){state.accountQuery='';state.accountAttention=false;render();return true;}
  if(action==='add-connection'){openConnectionForm();return true;}
  if(action==='edit-connection'){openConnectionForm(id);return true;}
  if(action==='choose-provider'){if(modalState?.type==='connection'&&!modalState.id)openConnectionForm(undefined,el.dataset.provider);return true;}
  if(action==='bind'){bindForm();return true;}
  if(action==='bind-back'){if(modalState?.type==='bind')bindForm(modalState.draft);return true;}
  if(action==='bind-account'){const c=connection(id);if(!c||(!state.future&&c.concept))return true;state.returnContext=null;state.addedConnection=null;navigate('workspace',state.scope);bindForm({connection:id});return true;}
  if(action==='add-for-bind'){rememberAdminOrigin(undefined,true);navigate('settings');openConnectionForm();return true;}
  if(action==='recover-for-bind'){rememberAdminOrigin(undefined,true);const c=connection(id);if(!c)return true;navigate('settings');if(c.status==='disabled')showAccountToggle(c);else openConnectionForm(id,c.provider,true);return true;}
  if(action==='project-settings'){projectSettings(id);return true;}
  if(action==='recovery-account'){const c=connection(id);if(!c||(!state.future&&c.concept))return true;rememberAdminOrigin(el.dataset.project);navigate('settings');if(c.status==='disabled')showAccountToggle(c);else openConnectionForm(id,c.provider,c.status==='reauth');return true;}
  if(action==='verify'){const c=connection(id);if(state.screen!=='settings'||!c||c.concept||c.status==='disabled')return true;if(c.status==='reauth')openConnectionForm(id,c.provider,true);else{c.checked='Только что';render();toast('Доступ к аккаунту «'+c.label+'» проверен — демо');}return true;}
  if(action==='toggle-connection'){if(state.screen==='settings')showAccountToggle(connection(id));return true;}
  if(action==='toggle-project'){
    const p=project(id);if(!p||!allowedWorkspace(p.workspace))return true;
    if(state.screen!=='workspace'&&state.screen!=='crm')return true;
    modalState={type:'toggle-project',id};
    prepareModal(modalShell(p.enabled?'Отключить обновление проекта?':'Включить обновление проекта?',escape(p.name)+' · '+escape(workspace(p.workspace).name),`<p>${p.enabled?'Будет остановлено обновление только этого проекта.':'Будет разрешено обновление этого проекта при исправном доступе к аккаунту CRM.'}</p><div class="form-note">Сохранённые данные, связи с сотрудниками и привязка к рабочему пространству остаются.${p.provider==='DIKIDI'?' Отключение не освобождает место для другого проекта DIKIDI.':''}</div>`,p.enabled?'Отключить обновление':'Включить обновление'));return true;
  }
  if(action==='duplicate-project'){const p=project(id);if(p){state.returnContext=null;navigate('workspace',p.workspace,p.id);}return true;}
  return false;
}
function adminFormError(message,extra=''){
  const target=$('#dialog-error');if(target){target.innerHTML=escape(message)+(extra?'<br>'+extra:'');target.setAttribute('tabindex','-1');target.focus();}
}
function handleAdminSubmit(context,data,form){
  const types=['connection','bind','project-settings','toggle-connection','toggle-project'];if(!types.includes(context?.type))return false;if(!admin())return true;
  if(context.type==='connection'){
    if(state.screen!=='settings')return true;
    let c=connection(context.id);if(context.id&&!c)return true;if(!state.future&&context.provider!=='DIKIDI')return true;
    const label=String(data.get('label')||'').trim();
    if(context.provider==='DIKIDI'){
      const phone=String(data.get('phone')||'').trim(),hasSecret=Boolean(String(data.get('secret')||''));
      if(context.id&&!phone&&!hasSecret&&label===(c.label||'')){adminFormError('Измените название, телефон или пароль.');return true;}
      if(phone&&(!/^\+?[\d ()-]+$/.test(phone)||phone.replace(/\D/g,'').length<7)){adminFormError('Укажите корректный номер телефона.');return true;}
      if(phone&&!hasSecret){adminFormError('Для нового телефона укажите пароль.');return true;}
      if((context.recover||!context.id)&&!hasSecret){adminFormError('Укажите пароль для проверки доступа.');return true;}
      if(!context.id&&!phone){adminFormError('Укажите телефон аккаунта.');return true;}
      form.elements.secret.value='';data.delete('secret');
      if(!c){c={id:'demo-'+Date.now(),provider:'DIKIDI'};state.connections.push(c);}
      if(phone){const digits=phone.replace(/\D/g,'');c.hint='+7 ••• •••-'+digits.slice(-4,-2)+'-'+digits.slice(-2);}
      if(phone||hasSecret||!context.id){if(c.status==='disabled')c.previousStatus='connected';else c.status='connected';c.checked='Только что';}
    }else{
      const hint=String(data.get('hint')||'').trim();if(!hint){adminFormError('Укажите название или пример аккаунта.');return true;}
      if(!c){c={id:'demo-'+Date.now(),provider:context.provider};state.connections.push(c);}
      Object.assign(c,{hint,concept:true,checked:'—'});if(c.status!=='disabled')c.status='concept';
    }
    c.label=label||c.label||'Аккаунт '+providers[c.provider].name;
    const resume=state.returnContext?.bind?{...state.returnContext}:null;
    if(!context.id&&!resume)state.addedConnection=c.id;
    closeModal();
    if(resume){state.returnContext=null;navigate('workspace',resume.workspace);bindForm({...resume.draft,connection:c.id});}
    else render();
    toast(context.recover?'Доступ восстановлен. Данные проекта можно обновить — демо':'Аккаунт «'+c.label+'» сохранён — демо');return true;
  }
  if(context.type==='bind'){
    if(state.screen!=='workspace'||context.workspace!==state.scope)return true;
    const draft=context.step===1?Object.fromEntries(data.entries()):context.draft,c=connection(draft.connection);
    if(!c||(!state.future&&c.concept)){adminFormError('Выберите доступный аккаунт CRM.');return true;}
    draft.externalId=String(draft.externalId||'').trim();
    if(c.status==='disabled'||c.status==='reauth'){adminFormError('Восстановите доступ к выбранному аккаунту перед привязкой.');return true;}
    const existingType=c.provider==='DIKIDI'?state.projects.find(p=>p.provider==='DIKIDI'&&p.workspace===state.scope):null;
    if(existingType){adminFormError('В этом рабочем пространстве уже есть проект DIKIDI.',button('Открыть «'+escape(existingType.name)+'»','duplicate-project','quiet',`data-id="${escape(existingType.id)}"`));return true;}
    if(!draft.externalId){adminFormError('Укажите ID проекта.');return true;}
    if(c.provider==='DIKIDI'&&!/^[1-9][0-9]*$/.test(draft.externalId)){adminFormError('ID проекта DIKIDI должен быть положительным целым числом.');return true;}
    const duplicate=state.projects.find(p=>p.provider===c.provider&&p.externalId===draft.externalId);
    if(duplicate){adminFormError('Проект уже связан с рабочим пространством «'+workspace(duplicate.workspace).name+'».',button('Открыть существующую привязку '+icon('arrow'),'duplicate-project','quiet',`data-id="${escape(duplicate.id)}"`));return true;}
    if(!['Europe/Moscow','Asia/Yekaterinburg'].includes(draft.zone)){adminFormError('Выберите часовой пояс проекта.');return true;}
    if(context.step===1){
      context.draft=draft;context.step=2;context.checkedName=c.provider==='DIKIDI'?'Салон №'+draft.externalId.slice(-2):'Проект '+providers[c.provider].name+' · '+draft.externalId;
      prepareModal(modalShell('Подтвердите привязку','Шаг 2 из 2 · Демонстрационный результат проверки',`<div class="binding-preview"><div class="binding-source"><span class="eyebrow">Внешний проект ${providers[c.provider].name}</span><strong>${escape(context.checkedName)}</strong><small>ID ${escape(draft.externalId)}</small></div><div class="binding-arrow">${icon('arrow')}</div><div class="binding-target"><span class="eyebrow">Рабочее пространство ClientBus</span><strong>${escape(workspace(state.scope).name)}</strong></div></div><div class="form-note">Аккаунт: <strong>${escape(accountLabel(c))}</strong> · ${escape(c.hint)} · ${accountStateLabel(c)}<br>Часовой пояс: ${escape(friendlyZone(draft.zone))}${c.concept?'<br>Это пример будущего адаптера.':''}</div>`,'Привязать проект',button('Назад','bind-back','quiet')));return true;
    }
    const p={id:'demo-project-'+Date.now(),provider:c.provider,name:context.checkedName,externalId:draft.externalId,workspace:state.scope,connection:c.id,zone:draft.zone,enabled:true,lastSync:c.concept?'—':'Только что',concept:!!c.concept,masters:makeMasters(false),services:c.provider==='DIKIDI'?sampleServices():[]};
    state.projects.push(p);state.selectedProjects[state.scope]=p.id;state.returnContext=null;state.addedConnection=null;closeModal();render();toast('Проект «'+p.name+'» привязан. Откройте услуги или мастеров — демо');return true;
  }
  if(context.type==='project-settings'){
    const p=project(context.id),next=connection(String(data.get('connection')));if(state.screen!=='workspace'||!p||p.workspace!==state.scope||!next||next.provider!==p.provider)return true;
    if(next.id!==p.connection&&next.status!=='connected'&&next.status!=='concept'){adminFormError('Для смены аккаунта сначала восстановите его доступ к CRM.');return true;}
    const zone=String(data.get('zone'));if(!['Europe/Moscow','Asia/Yekaterinburg'].includes(zone)){adminFormError('Выберите часовой пояс.');return true;}
    p.connection=next.id;p.zone=zone;closeModal();render();toast('Настройки проекта «'+p.name+'» сохранены — демо');return true;
  }
  if(context.type==='toggle-connection'){
    if(state.screen!=='settings')return true;const c=connection(context.id);if(!c)return true;
    const enable=c.status==='disabled';if(enable)c.status=c.previousStatus||(c.concept?'concept':'connected');else{c.previousStatus=c.status;c.status='disabled';}
    closeModal();
    const resume=state.returnContext?.bind?{...state.returnContext}:null;
    if(enable&&resume){state.returnContext=null;navigate('workspace',resume.workspace);bindForm({...resume.draft,connection:c.id});}else render();
    toast(enable?'Аккаунт включён. Состояние входа и свежесть данных проверяются отдельно — демо':'Аккаунт отключён. Привязки и данные сохранены — демо');return true;
  }
  if(context.type==='toggle-project'){
    const p=project(context.id);if(!p||!allowedWorkspace(p.workspace))return true;p.enabled=!p.enabled;closeModal();render();toast(p.enabled?'Обновление проекта разрешено — демо':'Обновление проекта отключено. Привязка и данные сохранены — демо');return true;
  }
  return false;
}

render();

</script>
</body>
</html>
