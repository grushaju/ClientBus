spring:

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: dbo

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: system
    default-schema: system
    create-schemas: true
    baseline-on-migrate: true
    baseline-version: 1
    table: flyway_schema_history

  session:
    jdbc:
      initialize-schema: never
      table-name: system.SPRING_SESSION

clientbus:

  jwt:
