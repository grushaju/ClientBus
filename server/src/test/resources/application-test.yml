spring:

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: dbo
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: dbo,system
    default-schema: system
    create-schemas: true
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    table: flyway_schema_history

  session:
    jdbc:
      initialize-schema: never
      table-name: system.SPRING_SESSION

  kafka:
    consumer:
      group-id: clientbus.inbound.processor

logging:
