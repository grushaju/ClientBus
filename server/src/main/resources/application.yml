management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      roles: SUPER_ADMIN
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
        delivery:
          include: uiPipeline

clientbus:
  crm:
    sync:
      enabled: true
      scheduler-tick: 10s
      planning-interval: 1m
      workers: 4
      connection-workers: 1
      manual-priority: 100
      lease-duration: 2m
      heartbeat-interval: 20s
      retry-initial-delay: 30s
      retry-max-delay: 30m
      retry-multiplier: 2
      retry-jitter: 0.2
      aging-interval: 1m
      retired-job-retention: 30d
      datasets:
        # DIKIDI returns masters, services, categories and project metadata together.
        catalog:
          enabled: true
          refresh-interval: 15m
          stale-after: 15m
          priority: 70
        clients:
          enabled: true
          refresh-interval: 1h
          stale-after: 1h
          max-pages-per-run: 10
          max-run-duration: 1m
          continuation-delay: 5s
          priority: 40
        client-statistics:
          enabled: true
          refresh-interval: 1m
          stale-after: 24h
          item-retry-delay: 15m
          batch-size: 5
          max-run-duration: 1m
          priority: 30
        appointments:
          enabled: true
          refresh-interval: 3m
          stale-after: 3m
          max-pages-per-run: 31
          max-run-duration: 90s
          past-days: 7
          future-days: 30
          priority: 90
        schedules:
          enabled: true
          refresh-interval: 15m
          stale-after: 15m
          past-days: 1
          future-days: 30
          chunk-days: 7
          priority: 60
        history:
          enabled: true
          refresh-interval: 24h
          max-pages-per-run: 31
          max-run-duration: 90s
          past-days: 365
          future-days: 0
          priority: 10
        client-history:
          enabled: false
          max-pages-per-run: 31
          max-run-duration: 90s
          priority: 80
        finance:
          enabled: false
          refresh-interval: 1h
          stale-after: 1h
          batch-size: 5
          past-days: 30
          future-days: 0
          priority: 20
    secret-key: ${CLIENTBUS_CRM_SECRET_KEY:}
    secret-key-id: ${CLIENTBUS_CRM_SECRET_KEY_ID:primary}
    connect-timeout-ms: 5000
    request-timeout-ms: 15000
    max-response-bytes: 4194304
  notifications:
    creation-enabled: true
    sse-enabled: true
    history-submission-enabled: true
    metrics-poll-ms: 10000
    metrics-query-timeout-seconds: 2
    # Heartbeat SSE в секундах (1..60): короче — half-open сокеты (убитые idle-прокси без FIN)
    # быстрее освобождают слоты; клиентный idle-лимит подстраивается сам (heartbeat*2.5+5 с).
    heartbeat-seconds: ${CLIENTBUS_NOTIFICATIONS_HEARTBEAT_SECONDS:15}
    gateway:
      # Потоков на сотрудника: для shared-стендовых аккаунтов (несколько вкладок, устройства,
      # Playwright-воркеры) поднимать env: CLIENTBUS_NOTIFICATIONS_GATEWAY_MAX_CONNECTIONS_PER_EMPLOYEE=8
      # Достигнутый лимит больше не отказывает 429: вытесняется древнейший поток того же
      # сотрудника, а переподключение той же вкладки заменяет свой поток (19.11.2026).
      max-connections-per-employee: ${CLIENTBUS_NOTIFICATIONS_GATEWAY_MAX_CONNECTIONS_PER_EMPLOYEE:4}
      # Потолок жизни потока: абранный клиентом поток (закрытая вкладка без FIN, abort watchdog
      # клиента) держит слот не дольше этого срока. 1800 = прежние зашитые полчаса.
      stream-ttl-seconds: ${CLIENTBUS_NOTIFICATIONS_GATEWAY_STREAM_TTL_SECONDS:1800}
      # Непустая очередь, из которой ничего не ушло дольше этого срока, — поток закрывается как
      # вставший (писатель не дошёл до сокета; write-дедлайн на ожидание в очереди не взводится).
      stalled-after-seconds: ${CLIENTBUS_NOTIFICATIONS_GATEWAY_STALLED_AFTER_SECONDS:120}
      # Запас в Retry-After собственного 429 — клиент обязан прочитать его, а не удваивать свою
      # экспоненту и вереницей стучаться в тот же отказ.
      retry-after-seconds: ${CLIENTBUS_NOTIFICATIONS_GATEWAY_RETRY_AFTER_SECONDS:5}

  sync:
    recent-chats:
      interval: PT15M
      lease: PT30M

  jwt:
    # Ключ подписи обязан прийти извне. Значение, лежащее в репозитории, — это возможность
    # подписать собственный токен для любого, кто репозиторий читает; прежний ключ здесь и
    # был таким. Пустым он быть не может: JwtService отказывает в запуске и называет
    # переменную. Для локального запуска подойдёт тот же механизм, что и для ключей CRM, —
    # optional:file:./server/data/crm-secrets.properties (см. spring.config.import ниже).
    secret: ${CLIENTBUS_JWT_SECRET:}
    expiration: 1800000

  schema:
    phone:
      # На рабочем окружении выключить вне окна обслуживания: только проверка схемы.
      repair-on-startup: ${CLIENTBUS_PHONE_SCHEMA_REPAIR_ON_STARTUP:true}
      lock-timeout: ${CLIENTBUS_PHONE_SCHEMA_LOCK_TIMEOUT:5s}
      statement-timeout: ${CLIENTBUS_PHONE_SCHEMA_STATEMENT_TIMEOUT:2m}

  bootstrap:
    organization:
      name: Penny Kit's Company ©
      email: admin@admin.admin
      username: admin
      password: admin
      firstname: Penny
      lastname: Kit
      phone: +12.04.1961(YAG)

  storage:
    local-path: D:\clientbus\storage

  kafka:
    outbound:
      enabled-channels:
        - TELEGRAM
        - DIKIDI
        # KafkaAdmin создаёт топики команд и DLQ для перечисленных каналов при старте.




server:
  port: 8080
  address: 0.0.0.0
#  servlet:
#    context-path: /clientbus

logging:
  level:
    org.springframework.boot.actuate.endpoint.web.EndpointLinksResolver: WARN
    org.apache.kafka.clients.admin.AdminClientConfig: WARN
    org.apache.kafka.common.config.AbstractConfig: WARN
    org.apache.kafka.common.metrics.Metrics: WARN
    org.apache.kafka.common.utils.AppInfoParser: WARN
    org.apache.kafka.clients.*: WARN
#    org.hibernate.SQL: DEBUG
#    org.hibernate.orm.jdbc.bind: TRACE

# logging:
  # level:
    # org.springframework.web: DEBUG
    # org.springdoc: DEBUG
    # org.springframework.boot.autoconfigure: DEBUG

springdoc:
  # Основные настройки
  api-docs:
    enabled: true
    path: /v3/api-docs
    # Формат вывода: json или yaml (по умолчанию json)

  swagger-ui:
    enabled: true
    path: /swagger-ui.html

    # Дополнительные настройки UI
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    filter: true
    doc-expansion: none

  # Пакеты для сканирования
  packages-to-scan:
    - kit.penny.clientbus.server.controller
    # 13.3: коннекторы регистрируют свои тонкие web-адаптеры сами (пакет коннектора
    # называет модуль, а не server: сборка без коннектора ничего не сканирует).
    - kit.penny.clientbus.connector

  # Пути для сканирования (если нужно)
  paths-to-match:
    - /api/**
    - /v3/**

  # Параметры по умолчанию
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

  # Кэширование
  cache:
    disabled: false

spring:

  config:
    import:
      - optional:file:./server/data/crm-secrets.properties
      - optional:file:./data/crm-secrets.properties

  application:
    name: server

  datasource:
    url: jdbc:postgresql://localhost:5432/clientbus
    username: clientbus
    password: clientbus

    hikari:
      schema: dbo

  session:
    jdbc:
      initialize-schema: never
      table-name: system.SPRING_SESSION

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer

    consumer:
      outbound-group-id: clientbus.outbound.processor
      platform-events-group-id: clientbus.platform-events.processor
      platform-message-group-id: clientbus.platform-messages.processor
      platform-conversation-group-id: clientbus.platform-conversations.processor
      channel-read-group-id: clientbus.channel-read.processor
      connector-command-group-id: clientbus.connector-commands.processor
      history-sync-result-group-id: clientbus.history-sync-results.processor

#  security:
#    user:
#      name: clientbus
#      password: clientbus

  jpa:
    hibernate:
      ddl-auto: update

    open-in-view: false

    properties:
      hibernate:
        default_schema: dbo
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: dbo,system,crm
    default-schema: system
    create-schemas: true
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    table: flyway_schema_history

  # 13.3: платформенные свойства Telegram принадлежат модулю connector/telegram
  # (связаны со стартером spring-boot-starter-tdlib). Живут здесь как конфигурация
  # развёртывания сервера и удаляются вместе с зависимостью от модуля.
  telegram:
    client:
      # Example
#      api-id: 94575
#      api-hash: a3406de8d171bb422bb6ddf3bbd800e2
      # 60-01
      api-id: 33073180
      api-hash: af4cc39ef18fb85d54c2cef445627f97
      # 31-29
#      api-id: 31219459
#      api-hash: b956f4f74f8c2f6510e38d9f767b5640
      # 16.11: абсолютный каталог TDLib-сессий (был ./data/telegram — относительный путь
      # зависел от каталога запуска процесса). Переопределение — TELEGRAM_DATA_DIRECTORY.
      database-directory: ${TELEGRAM_DATA_DIRECTORY:D:/Project/Java/ClientBus/connector/telegram/data}
      database-encryption-key: TELEGRAM_DATABASE_SECRET

      use-test-dc: false
      use-file-database: false
      use-chat-info-database: true
      use-message-database: true
      use-secret-chats: true

      system-language-code: en
      device-model: ClientBus
      system-version: "1.0"
      application-version: "1.0"
      log-verbosity-level: 2

  # 13.4: техническое подключение DIKIDI (integration/dikidi) — общий клиент CRM и чатов.
  # Ревю 13.4: приоритет имеют ровно эти новые ключи clientbus.dikidi.* —
  # requests-per-second, request-burst, global-requests-per-second, global-request-burst,
  # request-parallelism, retry-base-ms, retry-max-ms; старые clientbus.crm.dikidi.*
  # читаются как значения по умолчанию и полностью совместимы. Таймауты и размер ответа
  # остаются на clientbus.crm.* (CrmSettings). Кэши журнала — на старых crm-ключах,
  # это забота crm/dikidi.
  # dikidi:
  #   chat:
  #     # 13.5: канал DIKIDI провизионится автоматически назначением DIKIDI-проекта на
  #     # workspace (решение 15.11.2026); конфигурационного binding больше нет.
  #     # recheck-ms — период доводки CREATED/отвалившихся аккаунтов до CONNECTED
  #     # (проверка доступа C01→C02; CRM-health такой проверкой не считается).
  #     # initial-pages — бюджет страниц C05 на тик начального импорта одного диалога
  #     # (по умолчанию 5; недогруженное продолжается следующим тиком с того же курсора).
  #     recheck-ms: 60000
  #     initial-pages: 5
